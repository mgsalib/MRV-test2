    <script>
      // Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If window.fetch is already non-configurable, no-op
        }
      })();
    </script>
